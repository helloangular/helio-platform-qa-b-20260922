{
  "name" : "Platform release",
  "run-name" : "${{ inputs.correlation-id }}",
  "on" : {
    "workflow_dispatch" : {
      "inputs" : {
        "correlation-id" : {
          "type" : "string",
          "default" : ""
        },
        "targets" : {
          "type" : "string",
          "default" : ""
        },
        "purpose" : {
          "type" : "choice",
          "options" : [ "forward", "redeploy", "recover" ],
          "default" : "forward"
        },
        "source_run_id" : {
          "type" : "string",
          "default" : ""
        }
      }
    }
  },
  "permissions" : {
    "contents" : "write",
    "actions" : "read",
    "deployments" : "write",
    "id-token" : "write"
  },
  "jobs" : {
    "platform" : {
      "uses" : "helloangular/helio-platform-qa-a-20260922/.github/workflows/platform.yml@6e811b93cbf0a9a4f8757cafaf6af8786d1360bb",
      "with" : {
        "application_id" : "875faf3e-3180-43aa-9cd8-9238d1198a14",
        "purpose" : "${{ inputs.purpose || 'forward' }}",
        "targets" : "${{ inputs.targets }}",
        "source_run_id" : "${{ inputs.source_run_id }}"
      },
      "secrets" : {
        "platform_read_token" : "${{ secrets.HELIO_PLATFORM_READ_TOKEN }}",
        "configuration_read_token" : "${{ secrets.HELIO_CONFIGURATION_READ_TOKEN }}",
        "protection_read_token" : "${{ secrets.HELIO_PROTECTION_READ_TOKEN }}"
      }
    }
  }
}